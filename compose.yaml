services:
  mariadb:
    image: mariadb:10.4
    container_name: mariadb-projeto-3b
    restart: unless-stopped
    ports:
      - "3313:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p$${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    container_name: app-projeto-3b
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: root
      DB_PASS: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - .:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy